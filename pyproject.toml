[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-code-agent"
version = "0.1.0"
description = "Java/SpringCloud business code intelligence and AI coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bca-server = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
